services:
  exam-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sysrank-exam-web
    ports:
      - "3000:3000"
    volumes:
      - ./logs/app:/app/logs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHON_SERVICE_URL=http://host.docker.internal:5000
      - SQL_SERVICE_URL=http://host.docker.internal:5001
      - JAVASCRIPT_SERVICE_URL=http://host.docker.internal:5002
      - JAVA_SERVICE_URL=http://host.docker.internal:5003
      - PYSPARK_SERVICE_URL=http://host.docker.internal:5005
      - DAX_SERVICE_URL=http://host.docker.internal:5006
      - DBT_SERVICE_URL=http://host.docker.internal:5004
      - SNOWFLAKE_SERVICE_URL=http://host.docker.internal:5007

      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=3072
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - exam-web
